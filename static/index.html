<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Northstar Homes | Sales Agent</title><link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="shell"><header><p class="eyebrow">NORTHSTAR HOMES</p><h1>Find your place at Northstar One</h1><p>Sector 79, Gurugram · 2 & 3 BHK</p></header>
    <section id="chat" aria-live="polite"><div class="message agent">Hello! I’m Nia, Northstar Homes’ virtual sales assistant. Are you exploring a 2 BHK or 3 BHK?</div></section>
    <form id="form"><input id="message" autocomplete="off" placeholder="Type in English, Hindi, or Hinglish…" aria-label="Message"><button>Send</button></form>
    <button id="finish" class="secondary" disabled>End chat & view analytics</button><pre id="analytics" hidden></pre>
  </main><script src="/static/app.js"></script>
</body></html>
